<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATTENDANCE MANAGEMENT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>ATTENDANCE MANAGEMENT</h1>
    </header>

    <!-- ログインフォーム -->
    <div id="login-card" class="card">
      <h2 class="title-blue">ログイン</h2>
      <p class="sub-text">メールアドレスおよびパスワードを入力してください。</p>

      <!-- エラーメッセージ表示エリア -->
      <div id="login-error-msg" class="error-banner hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">メールアドレス</label>
          <input type="email" id="login-email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="login-password">パスワード</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" required placeholder="パスワード">
            <button type="button" class="toggle-password" data-target="login-password">表示</button>
          </div>
        </div>

        <div class="forgot-link">
          <a href="#" class="blue-link js-not-ready">パスワードをお忘れですか？</a>
        </div>

        <button type="submit" class="btn btn-primary">続ける</button>
      </form>

      <div class="switch-mode">
        <span>アカウントが未登録ですか？</span>
        <a href="#" id="show-register-link" class="blue-link">アカウントの作成</a>
      </div>
    </div>

    <!-- アカウント作成フォーム -->
    <div id="register-card" class="card hidden">
      <h2 class="title-blue">アカウントの作成</h2>
      
      <div id="register-error-msg" class="error-banner hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="register-email">メールアドレス</label>
          <input type="email" id="register-email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="register-password">パスワード（6文字以上必須）</label>
          <div class="password-wrapper">
            <input type="password" id="register-password" minlength="6" required placeholder="6文字以上で入力">
            <button type="button" class="toggle-password" data-target="register-password">表示</button>
          </div>
        </div>

        <div class="form-group">
          <label for="register-password-confirm">パスワード（確認）</label>
          <div class="password-wrapper">
            <input type="password" id="register-password-confirm" minlength="6" required placeholder="パスワードを再入力">
            <button type="button" class="toggle-password" data-target="register-password-confirm">表示</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">登録して続ける</button>
      </form>

      <div class="switch-mode">
        <span>すでにアカウントをお持ちですか？</span>
        <a href="#" id="show-login-link" class="blue-link">ログイン</a>
      </div>
    </div>

    <!-- メールアドレス認証案内画面 -->
    <div id="verify-card" class="card hidden">
      <h2 class="title-blue">メールアドレス認証</h2>
      <p class="sub-text" style="margin-top: 16px; margin-bottom: 24px; line-height: 1.6;">
        入力されたメールアドレス宛にメールを送信しました。URLを開いてアカウント登録を完了させてください。
      </p>
      <button type="button" class="btn btn-primary js-back-to-login">ログイン画面に戻る</button>
    </div>

    <!-- 準備中画面 -->
    <div id="not-ready-card" class="card hidden">
      <h2 class="title-blue">準備中。</h2>
      <p class="sub-text">この機能は現在準備中です。今しばらくお待ちください。</p>
      <button type="button" class="btn btn-primary js-back-to-login">ログイン画面に戻る</button>
    </div>

    <!-- フッター（各種規約） -->
    <footer class="app-footer">
      <a href="#" class="blue-link js-not-ready">プライバシーポリシー</a>
      <a href="#" class="blue-link js-not-ready">利用規約</a>
      <a href="#" class="blue-link js-not-ready">会員規約</a>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
